<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="components_new.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="header-left">
      <button id="home-btn" class="header-btn">🏠 Home</button>
      <button id="settings-btn" class="header-btn">⚙️ Settings</button>
      <button id="theme-toggle" class="header-btn">Toggle Theme</button>
    </div>
    <div class="header-center">
      <h1>Mood Tracker</h1>
    </div>
    <div class="header-right">
      <button id="show-mood-calendar" class="header-btn">📅 Mood Calendar</button>
    </div>
  </header>

  <!-- Settings Panel -->
  <aside id="settings-panel" class="settings-panel hidden">
    <h2>Settings</h2>
    <div class="setting-item">
      <label for="confetti-color">Confetti Color:</label>
      <input type="color" id="confetti-color" value="#FF6F61">
    </div>

    <div class="setting-item">
      <label for="audio-select">Background Audio:</label>
      <select id="audio-select">
        <option value="">None</option>
        <option value="calming">Calming Music</option>
        <option value="meditation">Meditation</option>
        <option value="nature">Nature Sounds</option>
      </select>
      <button id="audio-toggle">🔊 Play</button>
    </div>
    <div class="setting-item">
      <label for="storage-type">Storage:</label>
      <select id="storage-type">
        <option value="local">LocalStorage</option>
        <option value="session">SessionStorage</option>
      </select>
    </div>
    <button id="close-settings" class="submit-btn">Close</button>
  </aside>

  <!-- Mood Tracker -->
  <section class="mood-tracker">
    <div class="progress-bar" id="progress-bar"></div>
    <h2>Track Your Mood</h2>
    <div id="question-container"></div>

    <div class="navigation-buttons">
      <button id="prevBtn" class="submit-btn" disabled>Previous</button>
      <button id="nextBtn" class="submit-btn">Next</button>
    </div>

    <div id="mood-result"></div>
  </section>

  <!-- Mood Wheel Panel -->
  <section id="mood-wheel-panel" class="hidden">
    <h2>Mood Wheel</h2>
    <canvas id="mood-wheel" width="400" height="400"></canvas>
    <button id="close-mood-wheel" class="submit-btn">Close</button>
  </section>

  <!-- Mood Calendar Panel -->
  <section id="mood-calendar-panel" class="hidden">
    <h2>Mood Calendar</h2>
    <div id="calendar-container"></div>
    <button id="close-calendar" class="submit-btn">Close</button>
  </section>
  
  <section id="mood-calendar-panel" class="hidden">
    <h2>Mood Calendar</h2>
    <div class="calendar-controls">
      <label for="calendar-view">View:</label>
      <select id="calendar-view">
        <option value="month">Month</option>
        <option value="year">Year at a Glance</option>
      </select>
      <label for="calendar-year">Year:</label>
      <input type="number" id="calendar-year" value="2025" min="2000" max="2100">
    </div>
    <div id="calendar-container"></div>
    <button id="close-calendar" class="submit-btn">Close</button>
  </section>
  <div id="calendar-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn">&times;</button>
      <div id="modal-calendar-container"></div>
    </div>
  </div>
  

  <!-- Hidden Audio Player -->
  <audio id="bg-audio" loop></audio>

  <!-- Confetti -->
  <div id="confetti"></div>

  <script src="script.js"></script>
</body>
</html>
